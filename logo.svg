<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#d4af37"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="75" fill="#1a1a1a"/>
  
  <!-- Scissors icon -->
  <g stroke="#d4af37" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Left blade circle -->
    <circle cx="70" cy="80" r="15"/>
    
    <!-- Right blade circle -->
    <circle cx="130" cy="80" r="15"/>
    
    <!-- Left handle -->
    <line x1="70" y1="80" x2="100" y2="130"/>
    
    <!-- Right handle -->
    <line x1="130" y1="80" x2="100" y2="130"/>
    
    <!-- Blades -->
    <line x1="70" y1="65" x2="70" y2="50"/>
    <line x1="130" y1="65" x2="130" y2="50"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" fill="#d4af37" text-anchor="middle">ÉLITE</text>
</svg>
